{% extends "layout.html" %}

{% block main %}
    <div class="text-center py-5 mt-5">
        <h1 class="display-1 text-danger fw-bold font-monospace">{{ top }}</h1>
        <p class="fs-4 text-secondary mt-2">Something went sideways on our server</p>
        <div class="border p-3 rounded bg-white max-auto d-inline-block shadow-sm">
            <code class="text-dark fs-5">{{ bottom }}</code>
        </div>
        <div class="mt-4">
            <a class="btn btn-outline-dark" href="javascript:history.back()">← Go Back</a>
        </div>
    </div>
{% endblock %}
