{% extends "layout.html" %}
{% block main %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm mt-5">
            <h3 class="text-center mb-3">Staff Login</h3>
            <form action="/login" method="post">
                <div class="mb-3">
                    <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" name="password" placeholder="Password" type="password" required>
                </div>
                <button class="btn btn-dark w-100" type="submit">Log In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
